server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: chapterly
  config:
    # Optional local files, both gitignored. Paths are relative to the working
    # directory, so start the app from the repo root.
    # - ./.env: KEY=value lines (AZURE_SPEECH_KEY, AZURE_SPEECH_REGION, KOKORO_BASE_URL),
    #   read as a properties file. Real environment variables still win.
    # - ./application-local.yml: overrides for anything below (see application.yml.example).
    # chapterly.env-file can point elsewhere (used by tests).
    import: optional:file:${chapterly.env-file:./.env}[.properties], optional:file:./application-local.yml

chapterly:
  # Providers in fallback order. The first available one is the default.
  providers:
    - kokoro
    - azure
  # Try the other providers when the requested one is down, times out or is out of quota.
  fallback: true
  # Optional shared token. When set, every /api/** request must send it in the
  # X-Chapterly-Token header (else 401). Set it whenever the backend is reachable from
  # other machines (e.g. over Tailscale). Empty = open API.
  api-token: ${CHAPTERLY_API_TOKEN:}
  kokoro:
    base-url: ${KOKORO_BASE_URL:http://localhost:8880}
    default-voice: af_heart
    model: kokoro
    timeout: 30s
    # Kokoro requests that run at once; the rest wait in a queue where the chunk the
    # listener is waiting for ("now") goes before prefetches. Time in the queue does not
    # count toward the timeout above.
    max-concurrent: 1
    # Offered when the Kokoro server's voice list can't be fetched.
    fallback-voices:
      - af_heart
      - af_bella
      - af_nicole
      - af_sarah
      - am_michael
      - am_adam
      - am_fenrir
      - bf_emma
      - bf_isabella
      - bm_george
      - bm_fable
      - bm_lewis
  azure:
    key: ${AZURE_SPEECH_KEY:}
    region: ${AZURE_SPEECH_REGION:}
    voice: en-US-BrianNeural
    timeout: 8s
    voices:
      - en-US-BrianNeural
      - en-US-AndrewNeural
      - en-US-GuyNeural
      - en-US-AvaNeural
      - en-US-EmmaNeural
      - en-US-JennyNeural
      - en-GB-RyanNeural
      - en-GB-SoniaNeural
  cors:
    allowed-origin-patterns:
      - chrome-extension://*
      - moz-extension://*
